<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1000" height="380" viewBox="0 0 1000 380">
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#070b16"/><stop offset="1" stop-color="#0b1730"/></linearGradient>
 <linearGradient id="blue" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#16c8ff"/><stop offset=".55" stop-color="#247bff"/><stop offset="1" stop-color="#9b5cff"/></linearGradient>
 <linearGradient id="red" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#ff354f"/><stop offset="1" stop-color="#ff6b9a"/></linearGradient>
 <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#1d4d83" opacity=".45"/></pattern>
 <filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 
</defs>
<rect width="100%" height="100%" rx="22" fill="url(#bg)"/><rect width="100%" height="100%" rx="22" fill="url(#dots)"/>

<text x="34" y="48" fill="#46b6ff" font-size="18" font-family="Arial" letter-spacing="2">// ABOUT ME</text>
<text x="34" y="105" fill="#f4f6ff" font-size="34" font-weight="bold" font-family="Arial">More Than Just a Developer</text>
<rect x="34" y="125" width="70" height="5" rx="2" fill="url(#red)"/>
<text x="34" y="168" fill="#c4cee0" font-size="18" font-family="Arial">I'm Milan Sahukar, a BCA graduate who enjoys</text>
<text x="34" y="197" fill="#c4cee0" font-size="18" font-family="Arial">building practical projects, learning technologies,</text>
<text x="34" y="226" fill="#c4cee0" font-size="18" font-family="Arial">and creating content. I like solving problems</text>
<text x="34" y="255" fill="#c4cee0" font-size="18" font-family="Arial">and improving my skills step by step.</text>
<rect x="34" y="286" width="280" height="54" rx="12" fill="#0b2a50" stroke="#247bff"><animate attributeName="stroke-opacity" values=".45;1;.45" dur="4s" repeatCount="indefinite"/></rect><text x="54" y="320" fill="#ffffff" font-size="17" font-family="Arial">Currently learning &amp; building →</text>
<text x="390" y="48" fill="#46b6ff" font-size="18" font-family="Arial" letter-spacing="2">// BEYOND THE CODE</text>
<rect x="390" y="82" width="170" height="245" rx="16" fill="#0b1930" stroke="#1d4d83"/><circle cx="475" cy="139" r="34" fill="#102b52" stroke="url(#blue)"/><text x="475" y="147" fill="#62c7ff" text-anchor="middle" font-size="23" font-family="Arial">⌘</text><text x="475" y="213" fill="#f5f7ff" text-anchor="middle" font-size="17" font-weight="bold" font-family="Arial">Technology</text><text x="475" y="243" fill="#aebbd2" text-anchor="middle" font-size="12" font-family="Arial">Exploring tools and ideas</text><rect x="410" y="282" width="130" height="5" rx="2" fill="#17385e"/><rect x="410" y="282" width="80" height="5" rx="2" fill="url(#blue)"/><rect x="580" y="82" width="170" height="245" rx="16" fill="#0b1930" stroke="#1d4d83"/><circle cx="665" cy="139" r="34" fill="#102b52" stroke="url(#blue)"/><text x="665" y="147" fill="#62c7ff" text-anchor="middle" font-size="23" font-family="Arial">✦</text><text x="665" y="213" fill="#f5f7ff" text-anchor="middle" font-size="17" font-weight="bold" font-family="Arial">Content Creation</text><text x="665" y="243" fill="#aebbd2" text-anchor="middle" font-size="12" font-family="Arial">Sharing what I learn</text><rect x="600" y="282" width="130" height="5" rx="2" fill="#17385e"/><rect x="600" y="282" width="80" height="5" rx="2" fill="url(#blue)"/><rect x="770" y="82" width="170" height="245" rx="16" fill="#0b1930" stroke="#1d4d83"/><circle cx="855" cy="139" r="34" fill="#102b52" stroke="url(#blue)"/><text x="855" y="147" fill="#62c7ff" text-anchor="middle" font-size="23" font-family="Arial">↗</text><text x="855" y="213" fill="#f5f7ff" text-anchor="middle" font-size="17" font-weight="bold" font-family="Arial">Fitness</text><text x="855" y="243" fill="#aebbd2" text-anchor="middle" font-size="12" font-family="Arial">Building consistency</text><rect x="790" y="282" width="130" height="5" rx="2" fill="#17385e"/><rect x="790" y="282" width="80" height="5" rx="2" fill="url(#blue)"/>
</svg>